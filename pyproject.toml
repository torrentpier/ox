[project]
name = "torrentpier-archive"
version = "0.1.0"
description = "Static archive of the torrentpier.com XenForo 2 forum"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "boto3>=1.34",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[project.scripts]
xf-export = "exporter.main:main"
xf-build = "builder.main:main"
xf-mirror = "mirror.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["exporter*", "builder*", "mirror*"]

[tool.ruff]
line-length = 100
target-version = "py311"
