name: Build & deploy archive

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'templates/**'
      - 'static/**'
      - 'builder/**'
      - 'pyproject.toml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install builder
        run: pip install -e .

      - name: Render site
        run: python -m builder build --data data --out dist

      - name: Verify CNAME
        run: |
          test -f dist/CNAME
          grep -qx ox.torrentpier.com dist/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
